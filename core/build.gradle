[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation("com.google.inject:guice:7.0.0")
  implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.9'
  // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
  implementation("com.fasterxml.jackson.core:jackson-core:2.15.2")
  implementation("com.google.guava:guava:32.1.2-jre")
  implementation("com.google.inject.extensions:guice-assistedinject:7.0.0")
  implementation 'org.javatuples:javatuples:1.2'
  implementation("com.github.xaguzman:pathfinding:0.2.1")
  implementation("com.github.xaguzman:pathfinding-gdx-bridge:0.2.6")
  implementation "com.github.tommyettinger:gand:0.1.1"
  implementation group: 'com.github.tommyettinger', name: 'textratypist', version: '0.10.0'
  implementation group: 'io.github.classgraph', name: 'classgraph', version: '4.8.165'
  // https://mvnrepository.com/artifact/org.projectlombok/lombok
  compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.32'

  annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

